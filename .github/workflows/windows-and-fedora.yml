name: Windows and Fedora

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13', '3.14']
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64
      - run: python -m pip install . pytest pytest-timeout pytest-instafail
      - name: Verify native guarded file publication before the full suite
        run: python -m pytest tests/test_filesystem.py -q -x --timeout=60 --timeout-method=thread --basetemp="${{ runner.temp }}/letracode-preflight"
      - run: python -m pytest -q --instafail --timeout=300 --timeout-method=thread --basetemp="${{ runner.temp }}/letracode-tests" --junitxml=windows-tests.xml
      - run: python -m compileall -q letracode packaging
      - run: python packaging/build-release.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-tests-${{ matrix.python-version }}
          path: windows-tests.xml

  windows-package:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - run: python -m pip install -r packaging/windows-requirements.txt .
      - name: Install verified Inno Setup compiler
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $installer
          $expected = '9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732'
          if ((Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Inno Setup checksum mismatch' }
          $process = Start-Process $installer -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Inno Setup installation failed: $($process.ExitCode)" }
      - name: Build self-contained Windows downloads
        run: python packaging/build-windows.py
      - name: Install, open, update, uninstall, retain data and open portable app
        shell: pwsh
        run: |
          $version = python -c "from letracode import __version__; print(__version__)"
          python packaging/smoke-windows.py --installer "dist/LetraCode-$version-windows-x64-setup.exe" --portable "dist/LetraCode-$version-windows-x64-portable.zip" --work-dir "$env:RUNNER_TEMP/LetraCode Package Smoke"
      - name: Upload Windows downloads
        uses: actions/upload-artifact@v4
        with:
          name: LetraCode-windows-x64
          path: dist/LetraCode-*-windows-*
          if-no-files-found: error
          compression-level: 0
      - name: Upload native desktop screenshots and lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-package-verification
          path: |
            ${{ runner.temp }}/LetraCode Package Smoke/*.log
            ${{ runner.temp }}/LetraCode Package Smoke/*.json
            ${{ runner.temp }}/LetraCode Package Smoke/*.png
            build/windows/cache/LetraCode/warn-LetraCode.txt

  fedora:
    runs-on: ubuntu-latest
    container: fedora:44
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - run: dnf install -y git python3 python3-pyside6 python3-pypdf python3-pytest rpm-build redhat-rpm-config shadow-utils util-linux
      - uses: actions/checkout@v4
      - name: Test as an ordinary desktop user
        run: |
          useradd --create-home letracode-test
          chown -R letracode-test:letracode-test "$GITHUB_WORKSPACE"
          runuser -u letracode-test -- python3 -m pytest -q --junitxml=fedora-tests.xml
      - run: python3 -m compileall -q letracode packaging
      - run: bash -n install.sh uninstall.sh packaging/build-rpm.sh
      - run: packaging/build-rpm.sh
      - uses: actions/upload-artifact@v4
        with:
          name: LetraCode-fedora-and-source
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fedora-tests
          path: fedora-tests.xml
