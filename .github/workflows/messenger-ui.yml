name: Messenger UI

on:
  push:
    branches: [codex/messenger-theme-scroll]
  pull_request:
    branches: [main]
    paths:
      - 'letracode/**'
      - 'tests/test_messenger*'
      - '.github/workflows/messenger-ui.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: messenger-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libgl1
      - run: python -m pip install PySide6-Essentials==6.8.3 pytest pypdf
      - name: Prepare offline Qt verification dependencies
        run: python -m pip download --only-binary=:all: --no-deps PySide6-Essentials==6.8.3 shiboken6==6.8.3 -d qt-wheels
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qt-verification-wheels
          path: qt-wheels/*.whl
          retention-days: 1
          compression-level: 0
      - name: Run native Qt regression suite
        run: python -m pytest tests/test_experience.py tests/test_reasoning_ui.py tests/test_multimodel_ui.py -q
