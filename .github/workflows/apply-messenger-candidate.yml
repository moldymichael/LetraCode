name: Apply verified messenger candidate
on:
  push:
    branches: [codex/messenger-theme-scroll-fix]
    paths: [.github/workflows/apply-messenger-candidate.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/codex/messenger-theme-scroll-fix'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Install native test dependencies
        run: python -m pip install PySide6-Essentials==6.8.3 pypdf pytest
      - name: Verify and apply candidate
        shell: python
        run: |
          import base64, gzip, hashlib, pathlib, subprocess
          expected = '33a27fe192d6f5ae4cea9d87411993d8452dbd4b8035491885405824ef61d4b5'
          payload = pathlib.Path('.github/messenger.patch.b64').read_bytes()
          patch = gzip.decompress(base64.b64decode(payload))
          if hashlib.sha256(patch).hexdigest() != expected:
              raise SystemExit('Candidate transfer checksum mismatch; no source changes applied.')
          baseline = subprocess.check_output(['git', 'rev-parse', 'HEAD:letracode/ui.py'], text=True).strip()
          if baseline != 'd6127803181bb86b68fbacfbb5328649ce929c9c':
              raise SystemExit('Unexpected source baseline; refusing to overwrite other work.')
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '--index', '--whitespace=error', '-'], input=patch, check=True)
      - name: Native regression suite
        run: python -m pytest -q --junitxml=/tmp/messenger-results.xml | tee /tmp/messenger-tests.txt
      - name: Source validation
        run: |
          python -m compileall -q letracode packaging
          bash -n install.sh uninstall.sh packaging/build-rpm.sh
          git diff --cached --check
      - name: Commit only the tested application changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Implement neutral messenger bubbles and fix manual scrolling during generation'
          git push origin HEAD:refs/heads/codex/messenger-theme-scroll-fix
      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: messenger-native-test-results
          path: |
            /tmp/messenger-results.xml
            /tmp/messenger-tests.txt
          retention-days: 14
