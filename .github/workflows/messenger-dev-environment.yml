name: Messenger development environment
on:
  push:
    branches: [codex/messenger-theme-scroll-fix]
    paths: [.github/workflows/messenger-dev-environment.yml]
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - run: |
          python -m pip download --only-binary=:all: --platform manylinux_2_28_x86_64 --python-version 313 --implementation cp --abi abi3 --dest wheels PySide6-Essentials==6.8.3 shiboken6==6.8.3
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: messenger-qt-test-dependencies
          path: wheels/*.whl
          retention-days: 1
          compression-level: 0
